<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruit — Clover Kingdom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="eq-banner">
    Efficiency: <span class="eq">K=(S×C×D)/(T×G²)</span>
    <span class="sub">Showing up is the only requirement</span>
  </div>
  <nav>
    <div class="container nav-inner">
      <div class="logo" onclick="Router.navigate('/')">CLOVER <span>KINGDOM</span></div>
      <ul>
        <li><a href="#/">Home</a></li>
        <li><a href="#/cells">Cells</a></li>
        <li><a href="#/doctrine">Doctrine</a></li>
        <li><a href="#/grand-exchange">Exchange</a></li>
        <li><a href="#/glyphs">Glyphs</a></li>
        <li><a href="#/contact" class="active">Recruit</a></li>
      </ul>
    </div>
  </nav>
  <main id="page-content" class="container"></main>
  <footer>
    <div class="container">© Clover Kingdom — Showing up is the only requirement.</div>
  </footer>
  <script src="app.js"></script>
  <script>
    Router.register('/contact', function(content) {
      content.innerHTML = `
        <section class="reveal">
          <h2>Recruitment — Join the Kingdom</h2>
          <div class="recruit-block">
            <h3>Showing up is the only requirement</h3>
            <p>We build sovereign systems. No ego. No noise. Signal first, Discord second. Builders, join us.</p>
            <form style="max-width:500px;margin:2rem auto 0;text-align:left" onsubmit="event.preventDefault();alert('Signal received. Welcome to the kingdom. Build loop initiated.');">
              <div class="form-group">
                <label>Builder Alias</label>
                <input type="text" placeholder="Your name or handle" required>
              </div>
              <div class="form-group">
                <label>Signal (email)</label>
                <input type="email" placeholder="you@domain.io" required>
              </div>
              <div class="form-group">
                <label>Lane Preference</label>
                <select style="width:100%;padding:0.7rem;background:var(--black);border:1px solid #333;color:var(--white);font-family:var(--font)">
                  <option>Cell0 — Build</option>
                  <option>Cell1 — Visual</option>
                  <option>Cell2 — Archive</option>
                  <option>Cell3 — Outreach</option>
                </select>
              </div>
              <div class="form-group">
                <label>Why the kingdom?</label>
                <textarea rows="4" placeholder="One sentence. Be direct."></textarea>
              </div>
              <button class="btn btn-gold" type="submit">Send Signal →</button>
            </form>
          </div>
        </section>
        <section class="reveal">
          <div class="discord-box">
            <h4>Discord Relay — Secondary Channel</h4>
            <p style="color:var(--gray-light);margin-bottom:1rem">Signal through this site first. Discord is for coordination, not primary intake. No noise. No ego.</p>
            <button class="btn btn-purple" onclick="alert('Discord invite will be provisioned after signal receipt. Showing up is the only requirement.')">Request Discord Invite</button>
          </div>
        </section>
        <section class="reveal" style="text-align:center">
          <p style="color:var(--blood-glow);font-size:0.9rem;letter-spacing:0.15em">◈ The kingdom does not chase. It receives. ◈</p>
        </section>
      `;
      setTimeout(initScrollReveal, 100);
    });
    window.addEventListener('DOMContentLoaded', () => Router.init());
  </script>
</body>
</html>
