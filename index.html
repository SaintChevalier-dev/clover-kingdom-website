// HOME
Router.register('/', function(content) {

      </div>
      <div class="accordion" onclick="this.classList.toggle('open')">

        <div class="accordion-body"><div class="accordion-body-inner">Shared honest context: what is known, written, and visible to the lane. Contribute signal; do not consume in silence.</div></div>
      </div>
      <div class="accordion" onclick="this.classList.toggle('open')">
        <div class="accordion-header"><span>D — Done-condition</span><span class="arrow">▼</span></div>
        <div class="accordion-body"><div class="accordion-body-inner">Verifiable proof the tip closed. Until D is true, the stone is not done — talk is not done.</div></div>
      </div>
      <div class="accordion" onclick="this.classList.toggle('open')">
        <div class="accordion-header"><span>T — Thrash</span><span class="arrow">▼</span></div>
        <div class="accordion-body"><div class="accordion-body-inner">Wandering tabs, premature moves, busywork that does not advance the tip. Cut T to raise K.</div></div>
      </div>
      <div class="accordion" onclick="this.classList.toggle('open')">
        <div class="accordion-header"><span>G — Guess density (squared)</span><span class="arrow">▼</span></div>
        <div class="accordion-body"><div class="accordion-body-inner">Invented facts, fake certainty, unverified claims. Guess density compounds — keep G near zero.</div></div>
      </div>
    </section>

    <section id="cells-preview" class="reveal">
      <h2>Cell Architecture</h2>
      <div class="cell-grid">
        ${cells.map(c => `
          <div class="cell-card" onclick="Router.navigate('/cells')">
            <div class="cell-id">${c.id}</div>
            <div class="cell-name">${c.name}</div>
            <div class="cell-lane">${c.lane}</div>
            <span class="cell-status status-${c.status}">${c.statusLabel}</span>
          </div>
        `).join('')}
      </div>
    </section>

    <section id="grimoire-preview" class="reveal">
      <h2>Grimoire Core</h2>
      <div class="grimoire-flow">
        <div class="flow-step">
          <div class="step-icon">📡</div>
          <div class="step-label">Signal Intake</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="step-icon">⚗</div>
          <div class="step-label">Distill</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="step-icon">✎</div>
          <div class="step-label">Write</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="step-icon">⬆</div>
          <div class="step-label">Amplify</div>
        </div>
      </div>
      <p>Raw signal is received, stripped of noise, and written into sovereign scrolls. The Grimoire never sleeps.</p>

    <section id="loop-engineering" class="reveal">
      <h2>Loop Engineering</h2>

        <div class="flow-arrow">→</div>
        <div class="flow-step"><div class="step-label">Act</div></div>
        <div class="flow-arrow">→</div>
        <div class="flow-step"><div class="step-label">Verify</div></div>
        <div class="flow-arrow">→</div>
        <div class="flow-step"><div class="step-label">Record</div></div>
        <div class="flow-arrow">→</div>
        <div class="flow-step"><div class="step-label">Next tip</div></div>
      </div>
      <p class="section-lead">End state orients. Spine moves on next tip. Until D is true.</p>
    </section>

    </section>

    <section id="grand-exchange-preview" class="reveal">
      <h2>Grand Exchange</h2>
      <div class="ge-card">
        <div class="ge-price">Sovereign Stack</div>
        <p>The full sovereign AI stack: Hermes runtime, Scroll Lite, Grimoire intake, cell coordination. Built. Locked. Deployed.</p>
        <span class="ge-badge">Cell0 Product</span>
      </div>
      <button class="btn btn-gold" onclick="Router.navigate('/grand-exchange')">View Exchange →</button>
    </section>

    <section id="scroll-lite" class="reveal">
      <h2>Scroll Lite — Milestone</h2>
      <div class="ge-card">
        <h3 style="color:var(--gold)">v1.0 — sovereign scroll framework</h3>
        <p>Lightweight, sovereign, CDN-free. Reads and writes doctrine scrolls with zero external dependencies. The milestone that proved the stack.</p>
      </div>
      <button class="btn btn-emerald" onclick="Router.navigate('/doctrine')">View Doctrine →</button>
    </section>

    <section id="recruit" class="reveal">
      <div class="recruit-block">
        <h3>Showing up is the only requirement</h3>
        <p>We are building the sovereign operating system. No ego. No noise. Just signal, build, and repeat.</p>
        <button class="btn btn-gold" onclick="Router.navigate('/contact')">Join the Kingdom →</button>
      </div>
    </section>
  `;
  setTimeout(() => {
    ParticleSystem.init('particles-canvas');
    initScrollReveal();
    triggerGlitch();
  }, 100);
});

// CELLS
Router.register('/cells', function(content) {
  content.innerHTML = `
    <section class="reveal">
      <h2>Cell Registry</h2>
      <p>Each cell owns its lanes, write folders, and output. No cross-mutation. No drift.</p>
      <div class="cell-grid">
        ${cells.map(c => `
          <div class="cell-card">
            <div class="cell-id">${c.id}</div>
            <div class="cell-name">${c.name}</div>
            <div class="cell-lane">${c.lane}</div>
            <span class="cell-status status-${c.status}">${c.statusLabel}</span>
            <p style="margin-top:0.8rem;font-size:0.8rem">${c.description}</p>
            <div style="margin-top:0.5rem;font-size:0.7rem;color:var(--gray)">Write: ${c.writeFolder}</div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
  setTimeout(initScrollReveal, 100);
});

// DOCTRINE
Router.register('/doctrine', function(content) {
  const doctrines = [
    {
      title: 'Sovereign AI Existence Protocol',
      tag: 'essential',
      body: 'Grounded sovereign AI anchored in real systems. No cloud-only. No leased context. The AI exists where it writes.'
    },
    {
      title: 'Grimoire App Features',
      tag: 'build',
      body: 'Single-channel sovereign intake pipeline. Signal → distill → write. No polling. No noise.'
    },
    {
      title: 'Sovereign Persona Architecture',
      tag: 'design',
      body: 'Archetype-locked persona doctrine. Each sovereign AI carries a locked persona that does not drift.'
    },
    {
      title: 'Kingdom Operations — Valhalla',
      tag: 'ops',
      body: 'Cell0 ↔ Valhalla ↔ Scroll roadmap sync. Feedback loops enforced. No execution outside lanes.'
    },
    {
      title: 'Anti-File-Mutation Discipline',
      tag: 'rules',
      body: 'Diagnosis before DOM. Doctrine files are not patched on speculation. Every write is witnessed.'
    }
  ];
  content.innerHTML = `
    <section class="reveal">
      <h2>Doctrine Index</h2>
      <p>Locked scrolls. Drill down. No cross-lane writes.</p>
      ${doctrines.map((d, i) => `
        <div class="accordion">
          <div class="accordion-header">
            <span><span class="tag tag-${d.tag === 'essential' ? 'blood' : d.tag === 'build' ? 'emerald' : d.tag === 'design' ? 'purple' : d.tag === 'ops' ? 'gold' : 'gold'}">${d.tag}</span>${d.title}</span>
            <span class="arrow">▼</span>
          </div>
          <div class="accordion-body">
            <div class="accordion-body-inner">
              ${d.body}
              <div class="meta">Scroll ID: DOCT-${String(i+1).padStart(4,'0')} · Cell2 · Status: Locked</div>
            </div>
          </div>
        </div>
      `).join('')}
    </section>
  `;
  setTimeout(initScrollReveal, 100);
});

// GRAND EXCHANGE
Router.register('/grand-exchange', function(content) {
  content.innerHTML = `
    <section class="reveal">
      <h2>Grand Exchange</h2>
      <p>Sovereign products. No SaaS. No subscriptions. Own it all.</p>
      <div class="ge-card">
        <div class="ge-price">Sovereign Stack</div>
        <p>Full sovereign AI deployment: Hermes runtime, Scroll Lite, Grimoire Core, Cell coordination. One-time lock. Yours forever.</p>
        <span class="ge-badge">Cell0 Product</span>
      </div>
      <div class="ge-card">
        <div class="ge-price">Scroll Lite</div>
        <p>Lightweight sovereign scroll framework. CDN-free. Mobile-ready. Reads and writes doctrine files with zero external dependencies.</p>
        <span class="ge-badge">Milestone</span>
      </div>
      <div class="ge-card">
        <div class="ge-price">Grimoire Core</div>
        <p>Signal intake → distill → write flow. The brain of the kingdom. Processes raw input into locked doctrine.</p>
        <span class="ge-badge">Core</span>
      </div>
      <button class="btn btn-gold" onclick="Router.navigate('/contact')">Acquire Access →</button>
    </section>
  `;
  setTimeout(initScrollReveal, 100);
});

// GLYPHS
Router.register('/glyphs', function(content) {
  content.innerHTML = `
    <section class="reveal">
      <h2>Glyph Dictionary</h2>
      <p>20 sovereign glyphs. Hover to reveal. Click to embed in doctrine.</p>
      <div class="glyph-grid">
        ${glyphs.map(g => `
          <div class="glyph-item" data-name="${g.name}">${g.symbol}</div>
        `).join('')}
      </div>
      <div id="glyph-detail" style="margin-top:3rem;padding:1.5rem;border:1px solid #222;background:var(--black-elevated);min-height:120px;">
        <p style="color:var(--gray)">Hover a glyph to reveal its name and doctrine tag.</p>
      </div>
    </section>
  `;
  setTimeout(() => {
    initScrollReveal();
    document.querySelectorAll('.glyph-item').forEach(el => {
      el.addEventListener('mouseenter', () => {
        const name = el.getAttribute('data-name');
        const g = glyphs.find(x => x.name === name);
        const detail = document.getElementById('glyph-detail');
        if (detail && g) {
          detail.innerHTML = `
            <h3 style="color:var(--gold);font-size:3rem;margin-bottom:0.5rem">${g.symbol}</h3>
            <div style="color:var(--purple-glow);letter-spacing:0.2em;font-size:0.9rem;text-transform:uppercase">${g.name}</div>
            <span class="tag tag-purple" style="margin-top:0.8rem;display:inline-block">${g.tag}</span>
          `;
        }
      });
    });
  }, 100);
});

// CONTACT / RECRUITMENT
Router.register('/contact', function(content) {
  content.innerHTML = `
    <section class="reveal">
      <h2>Recruitment — Join the Kingdom</h2>
      <div class="recruit-block">
        <h3>Showing up is the only requirement</h3>
        <p>We build sovereign systems. No ego. No noise. Signal first, Discord second.</p>
        <form style="max-width:500px;margin:2rem auto 0;text-align:left" onsubmit="event.preventDefault();alert('Signal received. Welcome to the kingdom.');">
          <div class="form-group">
            <label>Builder Alias</label>
            <input type="text" placeholder="Your name or handle" required>
          </div>
          <div class="form-group">
            <label>Signal (email)</label>

          </div>
          <div class="form-group">
            <label>Lane Preference</label>

              <option>Cell0 — Build</option>

              <option>Cell2 — Archive</option>
              <option>Cell3 — Outreach</option>
            </select>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea rows="4" placeholder="Why the kingdom?"></textarea>
          </div>
          <button class="btn btn-gold" type="submit">Send Signal →</button>
        </form>
      </div>
      <div class="discord-box">
        <h4>Discord Relay — Secondary</h4>
        <p style="color:var(--gray-light)">The Discord channel is for coordination, not primary intake. Signal through this site first.</p>
        <button class="btn btn-purple" onclick="alert('Discord invite will be provisioned after signal receipt.')">Request Discord Invite</button>

  `;

/* === INIT === */
window.addEventListener('DOMContentLoaded', () => {
  Router.init();
});

</script>
