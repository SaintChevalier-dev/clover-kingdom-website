<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctrine — Clover Kingdom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="eq-banner">
    Efficiency: <span class="eq">K=(S×C×D)/(T×G²)</span>
    <span class="sub">Showing up is the only requirement</span>
  </div>
  <nav>
    <div class="container nav-inner">
      <div class="logo" onclick="Router.navigate('/')">CLOVER <span>KINGDOM</span></div>
      <ul>
        <li><a href="#/">Home</a></li>
        <li><a href="#/cells">Cells</a></li>
        <li><a href="#/doctrine" class="active">Doctrine</a></li>
        <li><a href="#/grand-exchange">Exchange</a></li>
        <li><a href="#/glyphs">Glyphs</a></li>
        <li><a href="#/contact">Recruit</a></li>
      </ul>
    </div>
  </nav>
  <main id="page-content" class="container"></main>
  <footer>
    <div class="container">© Clover Kingdom — Showing up is the only requirement.</div>
  </footer>
  <script src="app.js"></script>
  <script>
    Router.register('/doctrine', function(content) {
      const doctrines = [
        { title: 'Sovereign AI Existence Protocol', tag: 'essential', body: 'Grounded sovereign AI anchored in real systems. No cloud-only. No leased context. The AI exists where it writes. Every scroll, every memory, every cell lane is local-first. The kingdom owns its stack.' },
        { title: 'Grimoire App Features', tag: 'build', body: 'Signal intake → distill → write flow. Single-channel sovereign pipeline. No polling. No noise. Every piece of signal is received, stripped, and written into locked doctrine.' },
        { title: 'Sovereign Persona Architecture', tag: 'design', body: 'Archetype-locked persona doctrine. Each sovereign AI carries a locked persona that does not drift. Persona is defined in scrolls, not in transient context windows.' },
        { title: 'Kingdom Operations — Valhalla', tag: 'ops', body: 'Cell0 ↔ Valhalla ↔ Scroll roadmap sync. Feedback loops enforced. No execution outside lanes. Every operation is witnessed, logged, and locked in doctrine.' },
        { title: 'Anti-File-Mutation Discipline', tag: 'rules', body: 'Diagnosis before DOM. Doctrine files are not patched on speculation. Every write is witnessed. Cross-profile mutation is forbidden. The lane rules are sacred.' },
        { title: 'Sovereign Reality Casting', tag: 'exec', body: 'Closed-loop human+AI collaborative planning and execution. No simulation without signal. Every plan is anchored in real artifacts, real files, real builds.' },
        { title: 'Kingdom Security Governance', tag: 'guard', body: 'Class-level umbrella for kingdom security governance. Passwords, tokens, keys — never in doctrine. The vault is separate. The kingdom is sovereign.' },
        { title: 'Sovereign Automation', tag: 'auto', body: 'Build sovereign automation with Hermes Agent\'s own tooling. No third-party SaaS. No leased APIs. The kingdom runs its own tools.' }
      ];
      content.innerHTML = `
        <section class="reveal">
          <h2>Doctrine Index</h2>
          <p>Locked scrolls. Drill down. No cross-lane writes. Showing up is the only requirement.</p>
          ${doctrines.map((d, i) => `
            <div class="accordion">
              <div class="accordion-header">
                <span><span class="tag tag-${d.tag === 'essential' ? 'blood' : d.tag === 'build' ? 'emerald' : d.tag === 'design' ? 'purple' : d.tag === 'ops' ? 'gold' : d.tag === 'exec' ? 'blood' : d.tag === 'guard' ? 'emerald' : 'gold'}">${d.tag}</span>${d.title}</span>
                <span class="arrow">▼</span>
              </div>
              <div class="accordion-body">
                <div class="accordion-body-inner">
                  ${d.body}
                  <div class="meta">Scroll ID: DOCT-${String(i+1).padStart(4,'0')} · Cell2 · Status: Locked · Lane: Doctrine/Read</div>
                </div>
              </div>
            </div>
          `).join('')}
        </section>
      `;
      setTimeout(initScrollReveal, 100);
    });
    window.addEventListener('DOMContentLoaded', () => Router.init());
  </script>
</body>
</html>
