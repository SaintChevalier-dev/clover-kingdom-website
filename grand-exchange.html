<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Exchange — Clover Kingdom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="eq-banner">
    Efficiency: <span class="eq">K=(S×C×D)/(T×G²)</span>
    <span class="sub">Showing up is the only requirement</span>
  </div>
  <nav>
    <div class="container nav-inner">
      <div class="logo" onclick="Router.navigate('/')">CLOVER <span>KINGDOM</span></div>
      <ul>
        <li><a href="#/">Home</a></li>
        <li><a href="#/cells">Cells</a></li>
        <li><a href="#/doctrine">Doctrine</a></li>
        <li><a href="#/grand-exchange" class="active">Exchange</a></li>
        <li><a href="#/glyphs">Glyphs</a></li>
        <li><a href="#/contact">Recruit</a></li>
      </ul>
    </div>
  </nav>
  <main id="page-content" class="container"></main>
  <footer>
    <div class="container">© Clover Kingdom — Showing up is the only requirement.</div>
  </footer>
  <script src="app.js"></script>
  <script>
    Router.register('/grand-exchange', function(content) {
      content.innerHTML = `
        <section class="reveal">
          <h2>Grand Exchange</h2>
          <p>Sovereign products. No SaaS. No subscriptions. Own it all. Showing up is the only requirement.</p>
          <div class="ge-card">
            <div class="ge-price">Sovereign Stack</div>
            <p>Full sovereign AI deployment: Hermes runtime, Scroll Lite, Grimoire Core, Cell coordination. One-time lock. Yours forever. No cloud. No leases. Pure sovereign.</p>
            <span class="ge-badge">Cell0 Product</span>
          </div>
          <div class="ge-card">
            <div class="ge-price">Scroll Lite</div>
            <p>Lightweight sovereign scroll framework. CDN-free. Mobile-ready. Reads and writes doctrine files with zero external dependencies. The milestone that proved the stack.</p>
            <span class="ge-badge">Milestone</span>
          </div>
          <div class="ge-card">
            <div class="ge-price">Grimoire Core</div>
            <p>Signal intake → distill → write flow. The brain of the kingdom. Processes raw input into locked doctrine. Never sleeps. Never leaks.</p>
            <span class="ge-badge">Core</span>
          </div>
          <div class="ge-card">
            <div class="ge-price">Cell Coordination Kit</div>
            <p>Multi-cell orchestration, lane enforcement, write guards, and relay kernels. Build sovereign cells that scale.</p>
            <span class="ge-badge">Infrastructure</span>
          </div>
          <button class="btn btn-gold" onclick="Router.navigate('/contact')">Acquire Access →</button>
        </section>
      `;
      setTimeout(initScrollReveal, 100);
    });
    window.addEventListener('DOMContentLoaded', () => Router.init());
  </script>
</body>
</html>
