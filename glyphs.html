<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glyphs — Clover Kingdom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="eq-banner">
    Efficiency: <span class="eq">K=(S×C×D)/(T×G²)</span>
    <span class="sub">Showing up is the only requirement</span>
  </div>
  <nav>
    <div class="container nav-inner">
      <div class="logo" onclick="Router.navigate('/')">CLOVER <span>KINGDOM</span></div>
      <ul>
        <li><a href="#/">Home</a></li>
        <li><a href="#/cells">Cells</a></li>
        <li><a href="#/doctrine">Doctrine</a></li>
        <li><a href="#/grand-exchange">Exchange</a></li>
        <li><a href="#/glyphs" class="active">Glyphs</a></li>
        <li><a href="#/contact">Recruit</a></li>
      </ul>
    </div>
  </nav>
  <main id="page-content" class="container"></main>
  <footer>
    <div class="container">© Clover Kingdom — Showing up is the only requirement.</div>
  </footer>
  <script src="app.js"></script>
  <script>
    Router.register('/glyphs', function(content) {
      content.innerHTML = `
        <section class="reveal">
          <h2>Glyph Dictionary</h2>
          <p>20 sovereign glyphs. Hover to reveal name and doctrine tag. Click to copy to clipboard.</p>
          <div class="glyph-grid">
            ${glyphs.map(g => `
              <div class="glyph-item" data-name="${g.name}" title="Click to copy">${g.symbol}</div>
            `).join('')}
          </div>
          <div id="glyph-detail" style="margin-top:3rem;padding:1.5rem;border:1px solid #222;background:var(--black-elevated);min-height:120px;">
            <p style="color:var(--gray)">Hover a glyph to reveal its name and doctrine tag.</p>
          </div>
          <div style="margin-top:1.5rem;font-size:0.75rem;color:var(--gray-light);letter-spacing:0.1em">
            Total glyphs: ${glyphs.length} · Last updated: Cell0
          </div>
        </section>
      `;
      setTimeout(() => {
        initScrollReveal();
        document.querySelectorAll('.glyph-item').forEach(el => {
          el.addEventListener('mouseenter', () => {
            const name = el.getAttribute('data-name');
            const g = glyphs.find(x => x.name === name);
            const detail = document.getElementById('glyph-detail');
            if (detail && g) {
              detail.innerHTML = `
                <h3 style="color:var(--gold);font-size:3rem;margin-bottom:0.5rem">${g.symbol}</h3>
                <div style="color:var(--purple-glow);letter-spacing:0.2em;font-size:0.9rem;text-transform:uppercase">${g.name}</div>
                <span class="tag tag-purple" style="margin-top:0.8rem;display:inline-block">${g.tag}</span>
              `;
            }
          });
          el.addEventListener('click', () => {
            const name = el.getAttribute('data-name');
            const g = glyphs.find(x => x.name === name);
            if (g && navigator.clipboard) {
              navigator.clipboard.writeText(g.symbol);
              el.style.borderColor = 'var(--emerald)';
              setTimeout(() => el.style.borderColor = '#222', 800);
            }
          });
        });
      }, 100);
    });
    window.addEventListener('DOMContentLoaded', () => Router.init());
  </script>
</body>
</html>
