<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.discordapp.com; connect-src 'self' https://auth.cloverkingdom.net https://ck-sage-live.cloverkingdom.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Clover Kingdom: talk to Sage.">
  <link rel="canonical" href="https://cloverkingdom.net/base/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Clover Kingdom">
  <meta property="og:title" content="Clover Kingdom - Base">
  <meta property="og:description" content="Clover Kingdom: talk to Sage.">
  <meta property="og:url" content="https://cloverkingdom.net/base/">
  <meta property="og:image" content="https://cloverkingdom.net/base/assets/ref/sage-v06-front-noaura.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>Clover Kingdom - Base</title>
  <link rel="icon" type="image/svg+xml" href="/images/crest.svg">
  <link rel="modulepreload" href="/base/vendor/three.module.min.js">
  <link rel="modulepreload" href="/base/vendor/GLTFLoader.js">
  <link rel="stylesheet" href="base.css?v=19">
  <link rel="stylesheet" href="sage-book.css?v=4">
</head>
<body>
<a class="skip-link" href="#sage-book">Skip to Sage's book (chat)</a>
  <div id="ckw-still" class="ckw-still" hidden><img src="/base/assets/ref/sage-v06-front-noaura.jpg" alt="Sage" width="720" height="720"></div>
  <div id="ckw-yard" class="ckw-yard" aria-hidden="true" hidden>
    <canvas id="ckw-yard-canvas"></canvas>
    <p class="ckw-yard-label" id="ckw-yard-label" hidden></p>
  </div>
  <main class="base">
    <section class="login" id="login" aria-label="Login">
      <p class="login-status" id="login-status">Talk to Sage. Log in to keep your essence.</p>
      <a class="btn" id="login-btn" href="https://auth.cloverkingdom.net/auth/login">Log in with Discord</a>
      <button class="btn btn-quiet" id="logout-btn" type="button" hidden>Log out</button>
    </section>

    <section class="sage" aria-label="Sage">
      <h1 class="sage-name sr-only" id="sage-name">Sage</h1>
      <button id="sage-book" class="sage-book" type="button" aria-label="Talk to Sage." aria-expanded="false" aria-controls="sage-scroll" hidden>
        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="sbk-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#e8c877"/><stop offset="1" stop-color="#a87a1e"/></linearGradient></defs><path d="M32 16c-7-5-16-6-24-4v38c8-2 17-1 24 4 7-5 16-6 24-4V12c-8-2-17-1-24 4z" fill="#fbf8f1" stroke="url(#sbk-g)" stroke-width="3" stroke-linejoin="round"/><path d="M32 16v38" stroke="url(#sbk-g)" stroke-width="2.5"/><path d="M14 22c5-1 10 0 13 2M14 29c5-1 10 0 13 2M14 36c5-1 10 0 13 2M37 24c3-2 8-3 13-2M37 31c3-2 8-3 13-2M37 38c3-2 8-3 13-2" stroke="#c9a44c" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".8"/><circle cx="32" cy="9" r="4" fill="none" stroke="url(#sbk-g)" stroke-width="2"/></svg>
        <span class="sage-book-hint" aria-hidden="true">Talk to Sage</span>
      </button>
      <div class="sage-scroll" id="sage-scroll" role="region" aria-label="Chat with Sage" hidden>
        <div class="scroll-rod" aria-hidden="true"></div>
        <button type="button" class="sage-scroll-close" id="sage-scroll-close" aria-label="Close the chat (Escape)">&times;</button>
        <p class="sage-chat-note" id="sage-chat-note">SI archetypes may make mistakes.</p>
        <div class="sage-log" id="sage-log" role="log" aria-live="polite"></div>
        <form class="sage-form" id="sage-form" autocomplete="off">
          <label class="sr-only" for="sage-input">Message Sage</label>
          <input id="sage-input" type="text" maxlength="500" placeholder="Ask Sage something">
          <button class="btn btn-quiet" id="sage-mic" type="button" aria-label="Dictate a message. Press to start, press again to stop." aria-pressed="false" title="Dictate">🎙</button>
          <button class="btn" type="submit">Send</button>
        </form>
        <div class="guest-card" id="guest-card">
          <p class="guest-now">Teach me and I'll teach you. My name is Sage. And I hail from the Clover Kingdom.</p>
          <p class="guest-more">Log in to keep your essence and open the rest.</p>
        </div>
        <div class="scroll-rod" aria-hidden="true"></div>
      </div>
    </section>

    <section class="wv" id="webverse" aria-label="Webverse playtest" hidden>
      <!-- Playtest, roadmap, upgrades, and reference blocks moved behind the public face. Restored later behind login. -->
    </section>

    <footer class="base-foot">
      <p class="privacy" id="privacy"><a href="/privacy/">Privacy</a></p>
    </footer>
  </main>
  <script src="edisk.js?v=1"></script>
  <script src="sage-edits.js?v=2"></script>
  <script src="base.js?v=19"></script>
  <script src="sage-book.js?v=3"></script>
  <script src="webverse.js?v=4"></script>
  <script type="module" src="sage-3d.js?v=14"></script>
<nav class="ck-privacy-nav" aria-label="Privacy"><a class="ck-privacy-corner" href="/privacy/" title="Chats may be stored to help her learn. See Privacy." aria-label="Chats may be stored to help her learn. See Privacy.">essence tracks</a></nav>
</body>
</html>
